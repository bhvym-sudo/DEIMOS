name: deimos

services:
  tor:
    build:
      context: .
      dockerfile: infra/tor/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9050:9050"
    volumes:
      - tor_data:/var/lib/tor
    networks:
      deimos_net:
        ipv4_address: 172.30.0.10

  go-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DEIMOS_ROOT: /app
      DEIMOS_GO_ADDR: 0.0.0.0:8787
      DEIMOS_TOR_PROXY: tor:9050
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./phobos/databases:/app/phobos/databases
      - ./config:/app/config
    depends_on:
      tor:
        condition: service_healthy
    networks:
      - deimos_net

  python-api:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    restart: unless-stopped
    environment:
      DEIMOS_ROOT: /app
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./phobos/databases:/app/phobos/databases
      - ./phobos/config_files:/app/phobos/config_files
    networks:
      - deimos_net

  analysis-worker:
    build:
      context: .
      dockerfile: ai_service/Dockerfile.worker
    restart: unless-stopped
    volumes:
      - ./phobos/databases:/app/phobos/databases
      - ./phobos/models:/app/phobos/models
      - ./phobos/config_files:/app/phobos/config_files
      - analysis_reports:/app/phobos/reports
    depends_on:
      go-service:
        condition: service_healthy
    networks:
      - deimos_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_GO_API_URL: http://127.0.0.1:8787
        NEXT_PUBLIC_GO_WS_URL: ws://127.0.0.1:8787/ws
        NEXT_PUBLIC_PYTHON_API_URL: http://127.0.0.1:8001
        NEXT_PUBLIC_PYTHON_WS_URL: ws://127.0.0.1:8001/ws
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      go-service:
        condition: service_healthy
      python-api:
        condition: service_healthy
    networks:
      - deimos_net

networks:
  deimos_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  tor_data:
  analysis_reports:
