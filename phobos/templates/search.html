<!DOCTYPE html>
<html>
<head>
    <title>PHOBOS Search</title>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #0a0a0a; 
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        h1 { 
            font-size: 64px; 
            color: #ffffff;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 8px;
        }
        .search-box {
            position: relative;
        }
        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 1px solid #333;
            border-radius: 24px;
            background: #1a1a1a;
            color: #e0e0e0;
            outline: none;
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            border-color: #666;
            background: #222;
        }
        .info {
            margin-top: 30px;
            font-size: 13px;
            color: #666;
        }
        .stats {
            margin-top: 40px;
            padding: 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
        }
        .stat-item {
            display: inline-block;
            margin: 0 20px;
            font-size: 14px;
        }
        .stat-number {
            color: #4EC9B0;
            font-weight: bold;
            font-size: 24px;
            display: block;
        }
        .stat-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PHOBOS</h1>
        <form action="/search" method="GET">
            <div class="search-box">
                <input type="text" name="q" placeholder="Search the dark web..." autofocus>
            </div>
        </form>
        <div class="info">
            Dark Web Search Engine
        </div>
        <div class="stats">
            <div class="stat-item">
                <span class="stat-number">{{ indexed_count }}</span>
                <span class="stat-label">Pages Indexed</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">{{ queue_size }}</span>
                <span class="stat-label">In Queue</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">{{ active_crawlers }}</span>
                <span class="stat-label">Active Crawlers</span>
            </div>
        </div>
    </div>
</body>
</html>
